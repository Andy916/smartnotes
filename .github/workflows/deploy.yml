name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Deploy to AWS EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # 1. Update system packages
          sudo apt-get update -y
          
          # 2. Install Docker Compose if it isn't there yet
          if ! command -v docker-compose &> /dev/null
          then
              sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
          fi
          
          # 3. Pull your updated images down from Docker Hub
          sudo docker pull andyhatt/smartnotes-backend:latest
          sudo docker pull andyhatt/smartnotes-ai:latest
          
          # 4. Inject the safe GitHub secrets as environment variables when starting the containers
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          
          # 5. Stop any old instances running and boot up the fresh cloud images
          sudo docker-compose down || true
          sudo docker-compose up -d